<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komoot Tour Map</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>Komoot Tour Map</h1>
            <div class="controls">
                <button id="zoomWarning" class="warning hidden">
                    Please zoom in to see tours
                </button>
            </div>
        </header>
        
        <main class="main">
            <div id="map" class="map"></div>
            <div id="tourInfo" class="tour-info hidden">
                <h2>Tour Information</h2>
                <div class="tour-details">
                    <p><strong>Name:</strong> <span id="tourName"></span></p>
                    <p><strong>Date:</strong> <span id="tourDate"></span></p>
                    <p><strong>Distance:</strong> <span id="tourDistance"></span></p>
                    <p><strong>Duration:</strong> <span id="tourDuration"></span></p>
                    <p><strong>Elevation Gain:</strong> <span id="tourElevation"></span></p>
                </div>
            </div>
        </main>
    </div>
    
    <script type="module" src="js/map.js"></script>
    <script type="module">
        import { TourMap } from './js/map.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            const map = new TourMap('map');
            
            // Show zoom warning when needed
            const zoomWarning = document.getElementById('zoomWarning');
            map.map.getView().on('change:resolution', () => {
                const zoom = map.map.getView().getZoom();
                zoomWarning.classList.toggle('hidden', zoom >= 8);
            });
        });
    </script>
</body>
</html>
